<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <filter id="neonSniper">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="90" fill="#0b0914" stroke="#06b6d4" stroke-width="3"/>
  <!-- Headgear -->
  <path d="M55 140 C55 80, 75 50, 100 50 C125 50, 145 80, 145 140 Z" fill="#161226" stroke="#581c87" stroke-width="2"/>
  <!-- Tactical Eyepiece / Monocle -->
  <circle cx="85" cy="100" r="16" fill="#0f172a" stroke="#06b6d4" stroke-width="3"/>
  <circle cx="85" cy="100" r="8" fill="#22d3ee" filter="url(#neonSniper)"/>
  <line x1="65" y1="100" x2="105" y2="100" stroke="#06b6d4" stroke-width="2"/>
  <line x1="85" y1="80" x2="85" y2="120" stroke="#06b6d4" stroke-width="2"/>
  <!-- Secondary Eye -->
  <path d="M115 100 Q125 93 135 100" stroke="#a855f7" stroke-width="3" fill="none"/>
  <!-- Respirator -->
  <polygon points="85,130 100,120 115,130 110,155 90,155" fill="#1e1832" stroke="#a855f7" stroke-width="2"/>
  <!-- Shoulders -->
  <path d="M30 185 C40 145, 75 142, 100 142 C125 142, 160 145, 170 185 Z" fill="#241b3d" stroke="#a855f7" stroke-width="2"/>
</svg>
