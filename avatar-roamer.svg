<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <filter id="neonPurple">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="90" fill="#090712" stroke="#9333ea" stroke-width="3"/>
  <!-- Heavy Armor Helmet -->
  <polygon points="60,60 100,35 140,60 148,110 135,145 100,160 65,145 52,110" fill="#1b122f" stroke="#c084fc" stroke-width="2.5"/>
  <!-- Front Shield Visor -->
  <polygon points="75,80 100,70 125,80 120,110 100,122 80,110" fill="#100b1e" stroke="#a855f7" stroke-width="2"/>
  <!-- Glowing Eye Slits -->
  <line x1="82" y1="92" x2="95" y2="92" stroke="#c084fc" stroke-width="3" stroke-linecap="round" filter="url(#neonPurple)"/>
  <line x1="105" y1="92" x2="118" y2="92" stroke="#c084fc" stroke-width="3" stroke-linecap="round" filter="url(#neonPurple)"/>
  <!-- Chin Armor / Ventilation -->
  <line x1="90" y1="135" x2="110" y2="135" stroke="#7e22ce" stroke-width="2"/>
  <line x1="92" y1="142" x2="108" y2="142" stroke="#7e22ce" stroke-width="2"/>
  <!-- Heavy Shoulder Plates -->
  <polygon points="25,185 55,145 75,150 50,185" fill="#3b0764" stroke="#a855f7" stroke-width="2"/>
  <polygon points="175,185 145,145 125,150 150,185" fill="#3b0764" stroke="#a855f7" stroke-width="2"/>
  <path d="M50 185 C65 145, 100 140, 150 185 Z" fill="#201538" stroke="#9333ea" stroke-width="2"/>
</svg>
