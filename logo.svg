<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Purple Gradients -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff" />
      <stop offset="30%" stop-color="#c084fc" />
      <stop offset="70%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#581c87" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1035" />
      <stop offset="50%" stop-color="#120b22" />
      <stop offset="100%" stop-color="#080511" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="cyberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="intenseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Shield Outer Frame -->
  <polygon points="250,25 450,90 410,380 250,475 90,380 50,90" 
           fill="url(#shieldGrad)" 
           stroke="url(#purpleGrad)" 
           stroke-width="8" 
           filter="url(#cyberGlow)" />

  <!-- Inner Cyber Lines / Circuit -->
  <polygon points="250,55 420,110 385,360 250,445 115,360 80,110" 
           fill="none" 
           stroke="#7e22ce" 
           stroke-width="2" 
           stroke-dasharray="10 6" 
           opacity="0.6" />

  <!-- Crown Peak Glow Background -->
  <circle cx="250" cy="180" r="100" fill="#a855f7" opacity="0.25" filter="url(#intenseGlow)" />

  <!-- THE CROWN (Geometric Cyber Esports Crown) -->
  <!-- Center Main Crown Blade -->
  <polygon points="250,95 285,190 250,225 215,190" 
           fill="url(#goldGrad)" 
           stroke="#ffffff" 
           stroke-width="2"
           filter="url(#cyberGlow)" />

  <!-- Left Crown Wing -->
  <polygon points="205,175 145,130 170,220 220,220" 
           fill="url(#purpleGrad)" 
           stroke="#c084fc" 
           stroke-width="2" />

  <!-- Right Crown Wing -->
  <polygon points="295,175 355,130 330,220 280,220" 
           fill="url(#purpleGrad)" 
           stroke="#c084fc" 
           stroke-width="2" />

  <!-- Far Left Crown Spike -->
  <polygon points="135,170 95,175 125,235 160,230" 
           fill="#581c87" 
           stroke="#9333ea" 
           stroke-width="2" />

  <!-- Far Right Crown Spike -->
  <polygon points="365,170 405,175 375,235 340,230" 
           fill="#581c87" 
           stroke="#9333ea" 
           stroke-width="2" />

  <!-- Crown Base Gem / Diamond -->
  <polygon points="250,210 275,235 250,260 225,235" 
           fill="#fef08a" 
           stroke="#ca8a04" 
           stroke-width="2" 
           filter="url(#intenseGlow)" />

  <!-- Crown Foundation Bar -->
  <polygon points="120,240 380,240 365,265 135,265" 
           fill="#3b0764" 
           stroke="#c084fc" 
           stroke-width="3" />

  <!-- Sharp Cyber V-Slash Under Crown -->
  <polyline points="150,280 250,350 350,280" 
            fill="none" 
            stroke="url(#neonGlow)" 
            stroke-width="6" 
            stroke-linecap="round"
            stroke-linejoin="round"
            filter="url(#cyberGlow)" />

  <polyline points="180,305 250,360 320,305" 
            fill="none" 
            stroke="#a855f7" 
            stroke-width="3" 
            stroke-linecap="round" />

  <!-- Glowing Core Star -->
  <polygon points="250,310 255,322 268,322 257,330 261,342 250,334 239,342 243,330 232,322 245,322" 
           fill="#ffffff" 
           filter="url(#intenseGlow)" />

  <!-- TEXT BANNER (KING ESPORT) -->
  <rect x="100" y="375" width="300" height="42" 
        fill="#07060a" 
        stroke="url(#purpleGrad)" 
        stroke-width="3" 
        rx="6" />

  <text x="250" y="404" 
        text-anchor="middle" 
        font-family="'Orbitron', 'Arial Black', sans-serif" 
        font-size="24" 
        font-weight="900" 
        letter-spacing="5" 
        fill="#ffffff">
    KING ESPORT
  </text>
</svg>
